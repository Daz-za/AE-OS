[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aeos"
version = "0.1.0"
description = "AE-OS building blocks: agent identity, delegated authority, an MCP gateway and signed receipts for AI agent actions"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Darren Lentz" }]
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "biscuit-python>=0.4"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Topic :: Office/Business :: Financial :: Accounting",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
aeos = "aeos.cli:main"
aeos-receipts = "aeos.cli:main"   # the earlier name, kept so existing scripts work

[project.urls]
Homepage = "https://ae-os.org"
Source = "https://github.com/Daz-za/ae-os"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aeos.ui" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
