[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aeos-receipts"
version = "0.1.0"
description = "Signed, independently verifiable receipts for AI agent actions (AE-OS)"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Darren Lentz" }]
requires-python = ">=3.9"
dependencies = ["cryptography>=41"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Topic :: Office/Business :: Financial :: Accounting",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
aeos-receipts = "aeos_receipts.cli:main"

[project.urls]
Homepage = "https://ae-os.org"
Source = "https://github.com/Daz-za/ae-os"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
