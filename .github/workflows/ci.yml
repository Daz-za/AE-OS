name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "python[test]"
      - run: pytest -q python/tests
      - run: python examples/invoice_demo.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --check
        working-directory: rust
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: rust
      - run: cargo test --locked
        working-directory: rust

  browser-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test python/src/aeos/ui/verify.test.mjs

  policy:
    runs-on: ubuntu-latest
    env:
      OPA_VERSION: "1.4.2"
      OPA_SHA256: "2c0ccdbbe0b8e2a5d12d9c42d92f1f34f494ffb32d1f3c4ddc36101be637d66f"
    steps:
      - uses: actions/checkout@v7
      - name: Install OPA
        run: |
          curl -sSfL -o opa "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  opa" | sha256sum -c -
          chmod +x opa && sudo mv opa /usr/local/bin/opa
      - run: opa check policy/payments.rego policy/close.rego
      - run: policy/build.sh --check
