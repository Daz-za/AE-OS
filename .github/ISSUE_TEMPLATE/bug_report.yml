name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, please report privately instead (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands or code, with made-up data only.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `aeos --version`, or the commit.
  - type: input
    id: env
    attributes:
      label: Environment
      description: Operating system and Python version.
